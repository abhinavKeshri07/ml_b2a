[project]
name = "ml-b2a"
version = "0.1.0"
description = ""
authors = [
    {name = "abhinav keshri",email = "abhinavkeshri@abhinavs-MacBook-Pro.local"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14.1 || >3.14.1"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "jupyterlab (>=4.6.5,<5.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "ipywidgets (>=8.1.9,<9.0.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "torch (>=2.15.0,<3.0.0)",
    "torchvision (>=0.29.2,<0.30.0)",
    "torchaudio (>=2.11.1,<3.0.0)",
    "torchmetrics (>=1.9.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "ml_b2a", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab-vim (>=4.1.4,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "black (>=26.10.1,<27.0.0)",
    "nbdime (>=4.0.4,<5.0.0)"
]
